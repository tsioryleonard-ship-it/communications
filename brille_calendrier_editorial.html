<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BRILLE — Calendrier Éditorial Instagram</title>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600&family=Gruppo&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green: #7BC47F;
      --green-pale: #E8F5E9;
      --green-dark: #3B8540;
      --blue: #78B8E0;
      --blue-pale: #E3F2FB;
      --blue-dark: #1565C0;
      --pink: #E0A0C8;
      --pink-pale: #FCE4EC;
      --pink-dark: #880E4F;
      --yellow: #F5C842;
      --yellow-pale: #FFF9C4;
      --yellow-dark: #795548;
      --bg: #FAFAF8;
      --surface: #FFFFFF;
      --border: #E8E6E0;
      --border-strong: #D0CEC8;
      --text: #1A1A18;
      --text-muted: #6B6960;
      --text-faint: #9E9B94;
      --radius: 14px;
      --radius-sm: 8px;
    }

    body {
      font-family: 'Quicksand', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
    }

    /* ── TOP BAR ── */
    .topbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-family: 'Gruppo', sans-serif;
      font-size: 22px;
      letter-spacing: 3px;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-dot {
      width: 9px; height: 9px;
      background: var(--green);
      border-radius: 50%;
      display: inline-block;
    }

    .topbar-sub {
      font-size: 12px;
      color: var(--text-muted);
      letter-spacing: 1.5px;
      font-family: 'Gruppo', sans-serif;
      text-transform: uppercase;
    }

    /* ── LAYOUT ── */
    .wrapper {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2rem 1.5rem 4rem;
    }

    /* ── FILTERS ── */
    .filters-bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 2rem;
      align-items: center;
    }

    .filter-label {
      font-size: 12px;
      color: var(--text-faint);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-right: 4px;
    }

    .filter-btn {
      padding: 6px 16px;
      border-radius: 20px;
      border: 1.5px solid var(--border-strong);
      font-family: 'Quicksand', sans-serif;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      background: var(--surface);
      color: var(--text-muted);
      transition: all 0.15s ease;
    }

    .filter-btn:hover { border-color: var(--green); color: var(--green-dark); }
    .filter-btn.active { border-color: transparent; color: white; }
    .filter-btn.active.f-all { background: #444; }
    .filter-btn.active.f-dim { background: var(--green); }
    .filter-btn.active.f-mer { background: var(--blue); }
    .filter-btn.active.f-story { background: var(--pink); }
    .filter-btn.active.f-reel { background: var(--yellow); color: #555; }

    /* ── LEGEND ── */
    .legend {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 2rem;
      font-size: 12px;
      color: var(--text-muted);
      align-items: center;
      padding: 12px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
    }

    .legend-item { display: flex; align-items: center; gap: 6px; }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .legend-sep { color: var(--border-strong); }

    /* ── WEEK BLOCKS ── */
    .week-block { margin-bottom: 2.5rem; }

    .week-label {
      font-family: 'Gruppo', sans-serif;
      font-size: 12px;
      letter-spacing: 2px;
      color: var(--text-faint);
      text-transform: uppercase;
      margin-bottom: 12px;
      padding-left: 12px;
      border-left: 3px solid var(--green);
    }

    .posts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 12px;
    }

    /* ── POST CARDS ── */
    .post-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      border-left: 4px solid;
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .post-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.07);
    }

    .post-card.dim  { border-left-color: var(--green); }
    .post-card.mer  { border-left-color: var(--blue); }
    .post-card.story{ border-left-color: var(--pink); }
    .post-card.reel { border-left-color: var(--yellow); }
    .post-card.hidden { display: none; }

    .post-type-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      padding: 2px 8px;
      border-radius: 10px;
      text-transform: uppercase;
      width: fit-content;
    }

    .badge-dim   { background: var(--green-pale);  color: var(--green-dark); }
    .badge-mer   { background: var(--blue-pale);   color: var(--blue-dark); }
    .badge-story { background: var(--pink-pale);   color: var(--pink-dark); }
    .badge-reel  { background: var(--yellow-pale); color: var(--yellow-dark); }

    .post-date  { font-size: 11px; color: var(--text-faint); }
    .post-title { font-size: 14px; font-weight: 600; color: var(--text); line-height: 1.35; }
    .post-theme { font-size: 12px; color: var(--text-muted); }

    .post-status {
      position: absolute;
      top: 12px; right: 14px;
      width: 8px; height: 8px;
      border-radius: 50%;
    }

    .status-done    { background: var(--green); }
    .status-planned { background: var(--blue); }
    .status-idea    { background: var(--border-strong); }

    /* ── DIVIDER ── */
    .divider {
      border: none;
      border-top: 1px dashed var(--border);
      margin: 2rem 0;
    }

    /* ── MODAL BACKDROP ── */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(20, 20, 18, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 1rem;
      backdrop-filter: blur(2px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .modal-backdrop.open {
      opacity: 1;
      pointer-events: all;
    }

    .modal-box {
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      max-width: 560px;
      width: 100%;
      max-height: 88vh;
      overflow-y: auto;
      padding: 1.75rem;
      transform: translateY(12px);
      transition: transform 0.2s ease;
    }

    .modal-backdrop.open .modal-box { transform: translateY(0); }

    .modal-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 1.25rem;
    }

    .modal-close {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      font-size: 22px;
      line-height: 1;
      padding: 4px 8px;
      border-radius: 6px;
      transition: background 0.1s;
    }

    .modal-close:hover { background: var(--bg); }

    .modal-type-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text-faint);
      margin-bottom: 3px;
    }

    .modal-title {
      font-family: 'Gruppo', sans-serif;
      font-size: 20px;
      color: var(--text);
      line-height: 1.3;
    }

    .modal-date-badge {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .modal-section { margin-bottom: 1.25rem; }

    .modal-section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-faint);
      margin-bottom: 8px;
      padding-bottom: 4px;
      border-bottom: 1px solid var(--border);
    }

    .modal-content {
      font-size: 14px;
      line-height: 1.75;
      color: var(--text);
      white-space: pre-wrap;
    }

    .modal-tips {
      background: var(--bg);
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      padding: 10px 14px;
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.6;
    }

    .modal-hashtags {
      font-size: 12px;
      color: var(--blue);
      line-height: 2;
      word-break: break-word;
    }

    /* ── BUTTONS ── */
    .modal-cta {
      margin-top: 1.25rem;
      display: flex;
      gap: 10px;
    }

    .btn {
      flex: 1;
      padding: 11px 14px;
      border-radius: var(--radius-sm);
      font-family: 'Quicksand', sans-serif;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-secondary {
      background: var(--bg);
      border: 1.5px solid var(--border-strong);
      color: var(--text);
    }

    .btn-secondary:hover { background: var(--border); }

    .btn-primary {
      background: var(--green);
      border: none;
      color: white;
    }

    .btn-primary:hover { background: var(--green-dark); }

    /* ── TOAST ── */
    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #1A1A18;
      color: white;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      font-family: 'Quicksand', sans-serif;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s ease;
      z-index: 9999;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ── EMPTY STATE ── */
    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-faint);
      font-size: 14px;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 600px) {
      .topbar { padding: 1rem; flex-direction: column; gap: 4px; align-items: flex-start; }
      .wrapper { padding: 1.5rem 1rem 3rem; }
      .posts-grid { grid-template-columns: 1fr; }
      .modal-cta { flex-direction: column; }
    }
  </style>
</head>
<body>

<!-- TOP BAR -->
<header class="topbar">
  <div class="logo">
    BRILLE<span class="logo-dot"></span>
  </div>
  <span class="topbar-sub">Calendrier éditorial Instagram — Mai → Août 2026</span>
</header>

<!-- MAIN -->
<main class="wrapper">

  <!-- LEGEND -->
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:var(--green)"></div> Post dimanche</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--blue)"></div> Carrousel mercredi</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--pink)"></div> Story</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--yellow)"></div> Réel</div>
    <span class="legend-sep">·</span>
    <div class="legend-item"><div class="legend-dot" style="background:var(--green)"></div> Publié</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--blue)"></div> Planifié</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--border-strong)"></div> Idée</div>
  </div>

  <!-- FILTERS -->
  <div class="filters-bar">
    <span class="filter-label">Filtrer :</span>
    <button class="filter-btn f-all active" onclick="setFilter('all', this)">Tout voir</button>
    <button class="filter-btn f-dim"         onclick="setFilter('dim', this)">Dimanche</button>
    <button class="filter-btn f-mer"         onclick="setFilter('mer', this)">Mercredi</button>
    <button class="filter-btn f-story"       onclick="setFilter('story', this)">Stories</button>
    <button class="filter-btn f-reel"        onclick="setFilter('reel', this)">Réels</button>
  </div>

  <!-- CALENDAR CONTAINER -->
  <div id="calendar"></div>

</main>

<!-- MODAL -->
<div class="modal-backdrop" id="modal" onclick="handleBackdropClick(event)">
  <div class="modal-box">
    <div class="modal-top">
      <div>
        <div class="modal-type-label" id="m-type"></div>
        <div class="modal-title" id="m-title"></div>
        <div class="modal-date-badge" id="m-date"></div>
      </div>
      <button class="modal-close" onclick="closeModal()" aria-label="Fermer">✕</button>
    </div>

    <div class="modal-section">
      <div class="modal-section-title">Texte du post</div>
      <div class="modal-content" id="m-content"></div>
    </div>

    <div class="modal-section" id="m-tips-section">
      <div class="modal-section-title">Conseils visuels</div>
      <div class="modal-tips" id="m-tips"></div>
    </div>

    <div class="modal-section" id="m-tags-section">
      <div class="modal-section-title">Hashtags</div>
      <div class="modal-hashtags" id="m-tags"></div>
    </div>

    <div class="modal-cta">
      <button class="btn btn-secondary" onclick="copyPost()">📋 Copier le texte</button>
      <button class="btn btn-secondary" onclick="copyHashtags()">🔗 Copier les hashtags</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast">✓ Copié dans le presse-papiers</div>

<script>
const posts = [
  // ── SEMAINE 11 MAI ──
  {

    date: "Dim 11 mai",
    type: "dim",
    status: "planned",
    title: "Ce que les enfants disent sans les mots",
    theme: "Signaux QVE",
    content: `✨ Votre enfant ne dit pas toujours "je ne vais pas bien".

Mais il vous envoie des signaux.

Voici 3 comportements que j'observe souvent — et qui méritent qu'on s'y arrête :

1️⃣ Il refuse d'aller à l'école le matin alors qu'avant, il y allait sans broncher.

📩 tsioryleonard@gmail.com`,

    content: `On ne se connaît pas encore vraiment. Alors laissez-moi me présenter autrement.

// ── STATE ──
let currentFilter = 'all';
let currentPost = null;

// ── RENDER ──
function renderCalendar() {
  const cal = document.getElementById('calendar');
  cal.innerHTML = '';

  const weeks = {};
  const weekOrder = [];

  posts.forEach(p => {
    if (!weeks[p.week]) { weeks[p.week] = []; weekOrder.push(p.week); }
    weeks[p.week].push(p);
  });

  let hasAny = false;

  weekOrder.forEach(week => {
    const filtered = weeks[week].filter(p => currentFilter === 'all' || p.type === currentFilter);
    if (!filtered.length) return;
    hasAny = true;

    const block = document.createElement('div');
    block.className = 'week-block';

    const label = document.createElement('div');
    label.className = 'week-label';
    label.textContent = week;
    block.appendChild(label);

    const grid = document.createElement('div');
    grid.className = 'posts-grid';

    filtered.forEach(p => {
      const card = document.createElement('div');
      card.className = `post-card ${p.type}`;
      card.onclick = () => openModal(p);

      const statusDot = document.createElement('div');
      statusDot.className = `post-status status-${p.status}`;
      card.appendChild(statusDot);

      const badgeMap = {
        dim:   ['badge-dim',   'Dimanche'],
        mer:   ['badge-mer',   'Mercredi'],
        story: ['badge-story', 'Story'],
        reel:  ['badge-reel',  'Réel']
      };
      const [bc, bl] = badgeMap[p.type];
      const badge = document.createElement('div');
      badge.className = `post-type-badge ${bc}`;
      badge.textContent = bl;
      card.appendChild(badge);

      const date = document.createElement('div');
      date.className = 'post-date';
      date.textContent = p.date;
      card.appendChild(date);

      const title = document.createElement('div');
      title.className = 'post-title';
      title.textContent = p.title;
      card.appendChild(title);

      const theme = document.createElement('div');
      theme.className = 'post-theme';
      theme.textContent = p.theme;
      card.appendChild(theme);

      grid.appendChild(card);
    });

    block.appendChild(grid);
    cal.appendChild(block);

    const hr = document.createElement('hr');
    hr.className = 'divider';
    cal.appendChild(hr);
  });

  if (!hasAny) {
    cal.innerHTML = '<div class="empty-state">Aucun contenu pour ce filtre.</div>';
  }
}

// ── FILTER ──
function setFilter(type, btn) {
  currentFilter = type;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderCalendar();
}

// ── MODAL ──
function openModal(p) {
  currentPost = p;
  const badgeMap = { dim: 'Post dimanche', mer: 'Carrousel mercredi', story: 'Story', reel: 'Réel' };
  document.getElementById('m-type').textContent = badgeMap[p.type];
  document.getElementById('m-title').textContent = p.title;
  document.getElementById('m-date').textContent = p.date + ' · ' + p.theme;
  document.getElementById('m-content').textContent = p.content;

  const tipsSection = document.getElementById('m-tips-section');
  const tipsEl = document.getElementById('m-tips');
  if (p.tips) {
    tipsEl.textContent = p.tips;
    tipsSection.style.display = '';
  } else {
    tipsSection.style.display = 'none';
  }

  const tagsSection = document.getElementById('m-tags-section');
  const tagsEl = document.getElementById('m-tags');
  if (p.tags) {
    tagsEl.textContent = p.tags;
    tagsSection.style.display = '';
  } else {
    tagsSection.style.display = 'none';
  }

  document.getElementById('modal').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
  document.body.style.overflow = '';
  currentPost = null;
}

function handleBackdropClick(e) {
  if (e.target === document.getElementById('modal')) closeModal();
}

// ── KEYBOARD ──
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

// ── COPY ──
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function copyPost() {
  if (!currentPost) return;
  const text = currentPost.content + (currentPost.tags ? '\n\n' + currentPost.tags : '');
  navigator.clipboard.writeText(text).then(() => showToast('✓ Texte + hashtags copiés'));
}

function copyHashtags() {
  if (!currentPost || !currentPost.tags) return;
  navigator.clipboard.writeText(currentPost.tags).then(() => showToast('✓ Hashtags copiés'));
}

// ── INIT ──
renderCalendar();
</script>
</body>
</html>
