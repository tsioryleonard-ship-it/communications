INSTRUCTIONS POUR CLAUDE (outil « livret d'animation » BRILLE)
Quand Tsiory t'envoie ce fichier avec l'idée ou les notes d'un atelier et demande un livret d'animation :
1. Lis ses notes (et son livret precedent si elle en joint un). Redige le livret dans sa voix : facilitatrice bienveillante, non jugeante, « je »/« vous », citations a dire entre « », phrases courtes.
2. Produis UN fichier livret_<atelier>_<AAAA-MM-JJ>.json (JSON valide) a importer avec le bouton « Importer un brouillon (.json) » de cet outil. Teste l'import dans un navigateur headless si possible et verifie l'apercu (pages A4, pas de texte coupe).
3. Reponds court : ce qui est rempli, ce qui reste a verifier (articles de loi, chiffres, code de groupe Etincelle). Ne renvoie ce fichier HTML que si l'outil lui-meme est modifie.
CHAMPS DU JSON (tous facultatifs : ce qui manque prend la valeur par defaut de l'outil)
- offre : « Main tendue » (bleu), « Lueur » (jaune) ou « Rayon » (rose). date : « 21 novembre 2026 ». titre : deux lignes separees par \n (ex. « Ma place, mes droits\n— Ma vie de famille — »). infos : « Atelier parents · collectif · 2 h (14 h – 16 h) · Anniversaire de la CIDE ». soustitre : « Livret d'animation — support facilitateur · version avec Étincelle ».
- intention : texte balise (voir BALISES) avec « **Message directeur.** … », « **Objectifs.** » puis puces « - **Comprendre** : … », puis « **Matériel** : … ».
- posture : encadre « **Posture.** … **Cadre.** … ». avant : puces de l'encadre « Avant l'atelier : préparer Étincelle » (valeur par defaut deja bonne, utilise {code}, {petale}, {diapo}, {outilCarte}, {outilFiche}).
- moments : liste d'objets { debut:"0 min", fin:"15 min", horaire:"0 – 15 min" (vue d'ensemble), duree:"15 min", titre:"…", outils:"2, 3" (numeros des outils), label:"" (facultatif, remplace « Outils 2 et 3 »), etincelle:true (ligne en gras dans la vue d'ensemble), contenu:"texte balise" }. Le total des durees doit faire la duree de l'atelier. Ordre type : accueil, jeu ou brise-glace, apport (quiz, repere), mise en pratique, « La flamme qui passe : mon petit geste » (7 min), « Étincelle : à la maison, en famille » (8 min), cloture. Pour le moment Étincelle ecrire contenu:"@etincelle" (texte type fixe) ; ecrire la cloture en entier (merci, distribution de la fiche a emporter et de la carte Etincelle, prochains ateliers, « Dites-nous ce qui vous ferait du bien »).
- vigilance : puces « Points de vigilance facilitatrice » (valeur par defaut deja bonne). materiel : tableau balise « |% 6 47 17 15 15 », en-tete « | N° | Outil | Format | Quantité | Plastifier | » puis une ligne par outil ; la carte Etincelle en gras. aprevoir : « **À prévoir en plus.** … ».
- etincelle : { petale:"Ma place, mes droits", code:"CE7U-MFRR" (code de groupe cree par Tsiory dans « Gérer les familles » : ne jamais l'inventer), outilCarte:"14", outilFiche:"13", diapo:"12", mention:"Offert pour votre famille · 3 mois · sans obligation", carte:true }. Le QR code et la page « Carte Étincelle » sont generes automatiquement.
BALISES du texte (une ligne = un bloc) : « Texte » commencant par « = citation a dire (bleu) ; « - » = puce ; « ! Vigilance : texte » = encadre (idem « ! Temps : », « ! Objectif : ») ; lignes « | a | b | » = tableau (1re ligne = en-tete ; ligne facultative « |% 5 30 10 55 » avant = largeurs relatives) ; **gras** ; autre ligne = paragraphe.
REGLES : pas de conseil juridique (renvoyer a un professionnel) et articles de loi a faire relire sur legifrance.gouv.fr (le dire a Tsiory) ; rien d'invente sur le lieu, la structure ou le nombre de participants ; aucun tarif dans le livret ; aucune donnee personnelle de famille ; garder « © BRILLE, tous droits réservés » (deja dans le pied de page).

:root{--bg:#FFFFFF;--fg:#2E2A2A;--muted:#6f6767;--line:#e4dfd6;--accent:#3f6fa8;--accent-soft:#e6f3f9;--cta:#f49f4c;--danger:#a83840;--font:'Quicksand',system-ui,-apple-system,'Segoe UI',sans-serif}
*{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{background:#f4f2ee;color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5;margin:0;padding:0 16px}
.wrap{max-width:1180px;margin:0 auto;padding:18px 0 60px}
.bar7{display:flex;height:8px;border-radius:4px;overflow:hidden;margin-bottom:14px}.bar7 i{flex:1}
h1.app{font-size:24px;color:var(--accent);margin:0}
.sub{color:var(--muted);font-size:14px;margin:4px 0 14px;max-width:70ch}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
button{font:inherit;font-weight:600;cursor:pointer;border-radius:999px;border:2px solid var(--line);background:#fff;color:var(--fg);padding:7px 16px}
button:hover{border-color:var(--accent)}button.primary{background:var(--cta);border-color:var(--cta)}button.blue{background:var(--accent);border-color:var(--accent);color:#fff}button.warn{border-color:var(--danger);color:var(--danger)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.tabs button{border-radius:12px}.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.notice{background:var(--accent-soft);border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:14px}.notice.err{background:#fdeaea;color:var(--danger)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 16px}@media(max-width:700px){.grid2{grid-template-columns:minmax(0,1fr)}}
.f{display:flex;flex-direction:column;gap:4px;min-width:0;margin-top:10px}.f.full{grid-column:1/-1}.f>label{font-weight:600;font-size:14px}.hint{color:var(--muted);font-size:12.5px;font-weight:500}
input[type=text],select,textarea{font:inherit;width:100%;padding:8px 10px;border-radius:10px;border:1.5px solid var(--line);background:#fff;color:var(--fg);min-width:0}
textarea{resize:vertical;line-height:1.45}
fieldset.sec{border:1px solid var(--line);border-radius:16px;background:#fff;margin:0 0 16px;padding:4px 18px 18px;min-width:0}fieldset.sec legend{font-weight:700;font-size:17px;color:var(--accent);padding:0 8px}
.mom{border:1px solid var(--line);border-radius:14px;padding:10px 14px 14px;margin-top:12px;background:#fcfbf9}.momhead{display:flex;align-items:center;justify-content:space-between;gap:8px}.momhead .btns{display:flex;gap:6px}.momhead button{padding:3px 11px}
.stage{overflow-x:auto;background:#e4dfd6;border-radius:16px;padding:20px 12px}

/* ---------- Pages du livret (A4 : 794 x 1123 px) ---------- */
.pf{font-family:var(--font);font-size:12px;line-height:1.5;font-weight:500;color:#2E2A2A}
.page{position:relative;width:794px;height:1123px;background:#fff;margin:0 auto 24px;box-shadow:0 2px 12px rgba(0,0,0,.2);overflow:hidden;--a:#a8dbeb;--t:#3f6fa8;--bx:#eaf5fa}
.page .topbar{height:8px;background:var(--a)}
.page .plogo{position:absolute;left:63px;top:30px;width:64px;height:auto}
.page .ptr{position:absolute;right:63px;top:34px;text-align:right;line-height:1.45}
.page .ptr b{display:block;font-size:10px;letter-spacing:.6px;color:var(--t);font-weight:700}
.page .ptr span{font-size:10px;color:#6b7a8c;letter-spacing:.3px}
.page .pbody{position:absolute;left:63px;top:100px;width:668px;height:930px}
.page .pfoot{position:absolute;left:63px;right:63px;top:1044px;border-top:1px solid #dcdcdc;padding-top:8px;display:flex;font-size:9px;color:#7b7b7b;font-weight:500}
.page .pfoot .cp{flex:1;margin-left:24px}.page .pfoot .pn{font-weight:600}
#measure{position:absolute;left:-10000px;top:0;width:668px;visibility:hidden}
.it{margin:0 0 9px}
.it.p,.it.cite,.it.ul{text-align:justify}
.it.cite{color:var(--t)}
.it ul{margin:0;padding-left:19px}.it li{margin-bottom:5px}.it li:last-child{margin-bottom:0}
.it.top{position:relative;min-height:150px;margin-bottom:12px}
.it.top .kick{font-size:11px;font-weight:700;letter-spacing:.5px;color:var(--t);margin-top:2px}
.it.top h1{font-size:32px;line-height:1.2;font-weight:600;color:var(--t);margin:16px 0 0;max-width:430px}
.it.top .rule{margin:14px 0 14px}
.it.top .infos{margin:0;font-size:14px}.it.top .sub{margin:2px 0 0;font-size:12px;color:#6b6b6b;max-width:none}
.it.top .fleur{position:absolute;right:0;top:-2px;width:140px;height:auto}
.rule{width:40px;height:3px;border-radius:2px;background:var(--a)}
.it.h2{margin-bottom:12px}.it.h2 .h2t{font-size:17px;font-weight:700;color:var(--t);line-height:1.3}.it.h2 .rule{margin-top:7px}
.it.h3{margin-bottom:8px;font-size:13.5px;font-weight:700;color:var(--t);padding-top:8px}
.it.box{background:var(--bx);border:1px solid var(--a);border-radius:10px;padding:8px 13px;font-size:10.5px;line-height:1.45;text-align:left}
.it.box ul{padding-left:17px}.it.box li{margin-bottom:6px}.it.box .bt{display:block;font-weight:700;margin-bottom:5px}
.it.mh{display:flex;align-items:center;padding-top:12px;margin-bottom:8px}
.mh .pill{background:var(--a);border-radius:13px;padding:4px 11px;font-size:10px;font-weight:700;white-space:nowrap}
.mh .mt{font-size:16px;font-weight:700;color:var(--t);margin-left:11px;flex:1;line-height:1.25}.mh .mo{font-size:10px;color:#777;white-space:nowrap;margin-left:10px}
table.tb{width:100%;border-collapse:collapse;table-layout:fixed;font-size:10.5px;line-height:1.45}
table.tb th{color:var(--t);font-weight:700;font-size:9.5px;text-align:left;padding:6px 8px 6px 0;border-bottom:1px solid var(--a);vertical-align:bottom}
table.tb td{padding:7px 8px 7px 0;border-bottom:1px solid #d7ecf4;vertical-align:top;text-align:left}
.it.tbl{margin-bottom:0}.it.tbl.last{margin-bottom:10px}
.it.contact{text-align:center;font-size:9.5px;color:#777;margin-top:14px}
.page.card{--a:#cfe5b8}
.page.card .ptr b{color:#3b7a2a}.page.card .pbody{top:100px}
.cardtitle{font-size:16px;font-weight:700;color:#3f6fa8;margin:0 0 4px}.cardsub{font-size:10px;margin:0 0 16px;color:#2E2A2A}
.cards{display:grid;grid-template-columns:322px 322px;gap:16px}
.card1{background:#e8f2de;border:1px solid #c9e0b5;border-radius:16px;height:402px;padding:20px 22px;position:relative;color:#2E2A2A}
.card1 .cb{font-size:10px;font-weight:700;color:#3b7a2a;letter-spacing:.4px}.card1 .cn{font-size:25px;font-weight:700;color:#3b7a2a;line-height:1.15;margin-top:6px}.card1 .cs{font-size:10px;margin-top:2px}
.card1 .cmid{display:flex;gap:16px;margin-top:16px}
.card1 .qr{width:150px;height:150px;background:#fff;border-radius:12px;padding:10px;flex:none}.card1 .qr svg{width:100%;height:100%;display:block}
.card1 .steps{font-size:10.5px;line-height:1.5}.card1 .steps ol{margin:0;padding-left:16px}.card1 .steps li{margin-bottom:3px}
.card1 .code{margin-top:12px;font-size:10px;color:#3b7a2a;font-weight:700}.card1 .code b{display:block;font-size:11px}
.card1 .cf{position:absolute;left:22px;right:22px;bottom:18px;font-size:9px;line-height:1.45}.card1 .cf .of{display:block;color:#3b7a2a;font-size:11px;margin-bottom:6px}.card1 .cf .cc{color:#7b7b7b;font-size:8.5px;margin-top:3px}

@media print{
  @page{size:A4;margin:0}
  body{background:#fff;padding:0}
  .wrap>header,.wrap .bar7,.toolbar,.tabs,.notice,.panel>*:not(.stage),.noprint{display:none!important}
  .wrap,.panel,.stage{max-width:none;margin:0;padding:0;border:0;border-radius:0;background:none;overflow:visible}
  .page{margin:0;box-shadow:none;break-after:page;page-break-after:always}
  .page:last-child{break-after:auto;page-break-after:auto}
}
</style>

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;

      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate

      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {

            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(row * cellSize, col * cellSize, cellSize, cellSize);
        }
      }
    }

    return _this;
  };

  //---------------------------------------------------------------------
  // qrcode.stringToBytes
  //---------------------------------------------------------------------

  qrcode.stringToBytesFuncs = {
    'default' : function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        bytes.push(c & 0xff);
      }
      return bytes;
    }
  };

  qrcode.stringToBytes = qrcode.stringToBytesFuncs['default'];

  //---------------------------------------------------------------------
  // qrcode.createStringToBytes
  //---------------------------------------------------------------------

  /**
   * @param unicodeData base64 string of byte array.
   * [16bit Unicode],[16bit Bytes], ...
   * @param numChars
   */
  qrcode.createStringToBytes = function(unicodeData, numChars) {

    // create conversion map.

    var unicodeMap = function() {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {
              // 1byte
              bytes.push(b);
            } else {
              // 2bytes
              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };
  };

  // QRMode
  //---------------------------------------------------------------------

  var QRMode = {
    MODE_NUMBER :    1 << 0,
    MODE_ALPHA_NUM : 1 << 1,
    MODE_8BIT_BYTE : 1 << 2,
    MODE_KANJI :     1 << 3
  };

  //---------------------------------------------------------------------
  // QRErrorCorrectionLevel
  //---------------------------------------------------------------------

  var QRErrorCorrectionLevel = {
    L : 1,
    M : 0,
    Q : 3,
    H : 2

  //---------------------------------------------------------------------
  // QRMaskPattern
  //---------------------------------------------------------------------

  var QRMaskPattern = {
    PATTERN000 : 0,
    PATTERN001 : 1,
    PATTERN010 : 2,
    PATTERN011 : 3,
    PATTERN100 : 4,
    PATTERN101 : 5,
    PATTERN110 : 6,
    PATTERN111 : 7
  };

  var QRUtil = function() {

    var PATTERN_POSITION_TABLE = [
      [],
      [6, 18],
      [6, 22],
      [6, 26],
      [6, 30],
      [6, 34],
      [6, 22, 38],
      [6, 24, 42],
      [6, 26, 46],
      [6, 28, 50],
      [6, 30, 54],

    h += '<fieldset class="sec"><legend>Intention et préparation</legend><div class="grid2">' + fld('Intention de l\'atelier', 'intention', 'area', { rows: 12, full: true }) + fld('Posture et cadre (encadré)', 'posture', 'area', { rows: 4, full: true }) + fld('Avant l\'atelier (encadré)', 'avant', 'area', { rows: 6, full: true }) + '</div></fieldset>';
    h += '<fieldset class="sec"><legend>Déroulé</legend><p class="hint">Le total des durées doit faire la durée de l\'atelier.</p>' + (S.d.moments || []).map(momHtml).join('') + '<div class="toolbar" style="margin-top:12px"><button data-a="add">+ Ajouter un moment</button></div></fieldset>';
    h += '<fieldset class="sec"><legend>Fin du livret</legend><div class="grid2">' + fld('Points de vigilance facilitatrice', 'vigilance', 'area', { rows: 7, full: true }) + fld('Impression et matériel (tableau)', 'materiel', 'area', { rows: 10, full: true }) + fld('À prévoir en plus', 'aprevoir', 'area', { rows: 3, full: true }) + '</div></fieldset>';
    h += '<fieldset class="sec"><legend>Étincelle et carte à emporter</legend><div class="grid2">' + efld('Pétale', 'petale', 'ex. Ma place, mes droits') + efld('Code de groupe', 'code', 'Créé dans « Gérer les familles »') + efld('N° de l\'outil carte Étincelle', 'outilCarte') + efld('N° de l\'outil fiche à emporter', 'outilFiche') + efld('N° de la diapo Étincelle', 'diapo') + efld('Mention en bas de carte', 'mention') + '<div class="f full">' + efld('Adresse de base du QR code', 'url', 'Le code de groupe est ajouté à la fin') + '</div><div class="f"><label><input type="checkbox" data-ec="carte"' + (((S.d.etincelle || {}).carte !== false) ? ' checked' : '') + '> Ajouter la page « Carte Étincelle »</label></div></div></fieldset>';
    return h;
  }
  function aideHtml() {
    return '<div class="notice"><b>Pour un nouvel atelier,</b> envoie à Claude : ce fichier, ton idée ou tes notes (thème, durée, public, ce que tu veux faire vivre), puis écris « fais-moi le livret d\'animation ». Claude te renvoie un fichier <b>.json</b>.</div>' +
      '<ol style="line-height:1.75"><li>Clique sur <b>Importer un brouillon (.json)</b> et choisis le fichier : le livret se remplit.</li><li>Regarde l\'onglet <b>Aperçu et PDF</b> : les pages A4 se composent toutes seules.</li><li>Corrige ce que tu veux dans l\'onglet <b>Modifier</b> (le brouillon s\'enregistre automatiquement).</li><li>Clique sur <b>Imprimer ou enregistrer en PDF</b> et choisis « Enregistrer au format PDF », marges « Aucune », « Graphiques d\'arrière-plan » cochés.</li></ol>' +
      '<h2 style="font-size:16px;color:var(--accent)">Bon à savoir</h2><ul style="line-height:1.75"><li>Le code de groupe Étincelle vient de toi (créé dans « Gérer les familles ») : le QR code et la carte se font tout seuls.</li><li>Les articles de loi cités sont à relire sur legifrance.gouv.fr avant l\'atelier.</li><li>« Exporter » enregistre ton brouillon en .json : garde-le comme sauvegarde ou pour me le renvoyer.</li><li>Ce fichier reste sur ton ordinateur ; il n\'a pas besoin d\'aller sur GitHub. Le brouillon n\'est conservé que dans ce navigateur.</li></ul><p class="hint">© BRILLE, tous droits réservés.</p>';
  }
  function renderMain() {
    var m = document.getElementById('main'), h = '';
    h += '<div class="tabs" role="tablist">' + [['apercu', 'Aperçu et PDF'], ['edit', 'Modifier'], ['aide', 'Mode d\'emploi']].map(function (t) { return '<button role="tab" data-tab="' + t[0] + '" aria-selected="' + (S.tab === t[0]) + '">' + t[1] + '</button>'; }).join('') + '</div>';
    if (S.err) h += '<div class="notice err" role="alert">' + esc(S.err) + '</div>'; else if (S.msg) h += '<div class="notice" role="status">' + esc(S.msg) + '</div>';
    h += '<div class="toolbar"><button class="blue" data-a="import">Importer un brouillon (.json)</button><input type="file" id="imp" accept=".json,application/json" hidden><button data-a="export">Exporter (.json)</button>' + (S.tab === 'apercu' ? '<button class="primary" data-a="print">Imprimer ou enregistrer en PDF</button>' : '') + (S.confirm === 'new' ? '<button class="warn" data-a="new-ok">Confirmer : repartir d\'un modèle vierge</button><button data-a="cancel">Annuler</button>' : '<button data-a="new">Nouveau livret vierge</button>') + '</div>';
    if (S.tab === 'edit') h += editorHtml();
    else if (S.tab === 'aide') h += aideHtml();
    else h += '<div class="stage" id="stage"></div>';
    m.innerHTML = h;
    if (S.tab === 'apercu') renderPages(S.d, document.getElementById('stage'));
  }
  function download(name, text, type) {
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: type })); a.download = name; document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }
  function slug(s) { return String(s || 'livret').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^A-Za-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 50); }

  document.addEventListener('input', function (e) {
    var t = e.target;
    if (t.dataset.k) { S.d[t.dataset.k] = t.value; save(); }
    else if (t.dataset.e) { S.d.etincelle[t.dataset.e] = t.value; save(); }
    else if (t.dataset.mi != null && t.dataset.mk && t.type !== 'checkbox') { S.d.moments[+t.dataset.mi][t.dataset.mk] = t.value; save(); }
  });
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.id === 'imp') {
      var f = t.files && t.files[0]; if (!f) return; var rd = new FileReader();
      rd.onload = function () { try { S.d = merge(JSON.parse(rd.result)); save(); S.msg = 'Brouillon importé. Vérifie l\'aperçu, retouche si besoin, puis enregistre en PDF.'; S.err = ''; S.tab = 'apercu'; } catch (x) { S.err = 'Ce fichier n\'est pas un brouillon valide.'; } renderMain(); };
      rd.readAsText(f); return;
    }
    if (t.dataset.mi != null && t.type === 'checkbox') { S.d.moments[+t.dataset.mi][t.dataset.mk] = t.checked; save(); }
    else if (t.dataset.ec) { S.d.etincelle[t.dataset.ec] = t.checked; save(); }
    else if (t.dataset.k === 'offre') { S.d.offre = t.value; save(); }
  });
  document.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return; var a = b.dataset.a, i = +b.dataset.i;
    if (b.dataset.tab) { S.tab = b.dataset.tab; S.msg = ''; S.err = ''; return renderMain(); }
    if (a === 'import') { var fi = document.getElementById('imp'); if (fi) fi.click(); return; }
    if (a === 'export') { download('livret_' + slug(String(S.d.titre).split('\n')[0]) + '.json', JSON.stringify(S.d, null, 2), 'application/json'); S.msg = 'Brouillon exporté.'; return renderMain(); }
    if (a === 'print') { window.print(); return; }
    if (a === 'new') { S.confirm = 'new'; return renderMain(); }
    if (a === 'cancel') { S.confirm = ''; return renderMain(); }
    if (a === 'new-ok') { S.d = clone(BLANK); save(); S.confirm = ''; S.msg = 'Modèle vierge chargé.'; return renderMain(); }
    if (a === 'add') { S.d.moments.push({ debut: '', fin: '', horaire: '', duree: '', titre: '', outils: '', label: '', etincelle: false, contenu: '' }); save(); return renderMain(); }
    if (a === 'del') { S.d.moments.splice(i, 1); save(); return renderMain(); }
    if (a === 'up' && i > 0) { var x = S.d.moments; var t = x[i - 1]; x[i - 1] = x[i]; x[i] = t; save(); return renderMain(); }
    if (a === 'down' && i < S.d.moments.length - 1) { var y = S.d.moments; var u = y[i + 1]; y[i + 1] = y[i]; y[i] = u; save(); return renderMain(); }
    if (a === 'expand') { var mm = S.d.moments[i], c = String(mm.contenu).trim(); mm.contenu = c === '@etincelle' ? DEF_ETINCELLE : DEF_CLOTURE; save(); return renderMain(); }
  });
  window.__livret = { merge: merge, setData: function (d) { S.d = merge(d); save(); S.tab = 'apercu'; renderMain(); } };
  renderMain();
})();
</script>
</body>
